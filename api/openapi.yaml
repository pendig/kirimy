openapi: 3.0.3
info:
  title: Kirimy Daemon API
  version: 1.0.0
  description: HTTP adapter for CLI command execution (`kirimy-daemon`).
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health check daemon
      responses:
        '200':
          description: Daemon aktif
  /readyz:
    get:
      summary: Readiness check daemon
      responses:
        '200':
          description: Daemon siap
  /api/v1/commands:
    get:
      summary: List supported top-level commands
      responses:
        '200':
          description: Daftar command/subcommand yang dikenal
  /api/v1/exec:
    post:
      summary: Execute arbitrary wacli command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: array
                  items:
                    type: string
                args:
                  type: array
                  items:
                    type: string
                store:
                  type: string
                account:
                  type: string
                read_only:
                  type: boolean
                json:
                  type: boolean
                full:
                  type: boolean
                events:
                  type: boolean
                timeout:
                  type: string
                lock_wait:
                  type: string
      responses:
        '200':
          description: Command success/fail result
        '400':
          description: Command error
  /api/v1/{command}:
    get:
      summary: Route top-level command without explicit subcommand
      parameters:
        - in: path
          name: command
          required: true
          schema:
            type: string
        - in: query
          name: kind
          schema:
            type: string
      responses:
        '200':
          description: Result
        '400':
          description: Validation error
    post:
      summary: Route top-level command or command+subcommand
      parameters:
        - in: path
          name: command
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                store:
                  type: string
                account:
                  type: string
                read_only:
                  type: boolean
                json:
                  type: boolean
                full:
                  type: boolean
                events:
                  type: boolean
                timeout:
                  type: string
                lock_wait:
                  type: string
                args:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Result
        '400':
          description: Validation error
    put:
      summary: Route top-level command or command+subcommand
      parameters:
        - in: path
          name: command
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Result
        '400':
          description: Validation error
    patch:
      summary: Route top-level command or command+subcommand
      parameters:
        - in: path
          name: command
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Result
        '400':
          description: Validation error
  /api/v1/{command}/{subcommand}:
    get:
      summary: Route explicit command + subcommand
      parameters:
        - in: path
          name: command
          required: true
          schema:
            type: string
        - in: path
          name: subcommand
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Result
        '400':
          description: Validation error
    post:
      summary: Route explicit command + subcommand
      parameters:
        - in: path
          name: command
          required: true
          schema:
            type: string
        - in: path
          name: subcommand
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Result
        '400':
          description: Validation error
    put:
      summary: Route explicit command + subcommand
      parameters:
        - in: path
          name: command
          required: true
          schema:
            type: string
        - in: path
          name: subcommand
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Result
        '400':
          description: Validation error
    patch:
      summary: Route explicit command + subcommand
      parameters:
        - in: path
          name: command
          required: true
          schema:
            type: string
        - in: path
          name: subcommand
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Result
        '400':
          description: Validation error
